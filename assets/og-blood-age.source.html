<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --paper:#F1F5F5;
    --ink:#12232A;
    --ink-2:#4A6068;
    --ink-3:#7E9298;
    --rule:#C8D6D7;
    --accent:#0E6B6E;
    --warn:#A9761A;
  }
  html,body{width:1200px;height:630px}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Noto Sans KR",sans-serif;word-break:keep-all;
    padding:60px 68px 52px;display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;position:relative;overflow:hidden;
  }
  .num{font-family:"Archivo",sans-serif;font-variant-numeric:tabular-nums}

  /* 아래쪽에 계측기 눈금을 옅게 깔아 '재는 도구'라는 인상을 준다 */
  .grid{
    position:absolute;left:0;right:0;bottom:0;height:190px;
    background:repeating-linear-gradient(90deg,
      rgba(126,146,152,.20) 0 1px, transparent 1px 24px);
    -webkit-mask-image:linear-gradient(to top, #000, transparent);
            mask-image:linear-gradient(to top, #000, transparent);
  }

  .top{display:flex;align-items:center;gap:14px}
  .top svg{color:var(--accent)}
  .eyebrow{
    font-size:19px;font-weight:700;letter-spacing:.14em;color:var(--accent);
  }
  .meta{
    margin-left:auto;font-size:18px;font-weight:500;color:var(--ink-3);letter-spacing:.02em;
  }

  h1{
    margin-top:30px;font-size:70px;font-weight:900;line-height:1.24;
    letter-spacing:-.038em;
  }
  h1 em{font-style:normal;color:var(--accent)}

  /* ── 눈금자 ── */
  /* 중심선 95~102px. 위 라벨(약 73px)이 다 들어가도록 아래로 내려 잡는다 */
  .ruler{position:relative;height:196px;margin:auto 40px 0;flex:none}
  .track{position:absolute;left:0;right:0;top:95px;height:7px;border-radius:99px;background:var(--rule)}
  .span{position:absolute;top:95px;height:7px;border-radius:99px;background:var(--warn)}
  .tick{position:absolute;top:88px;width:2px;height:21px;background:var(--ink-3);opacity:.34}
  .pin{position:absolute;top:0;width:0}
  .pin .dot{
    position:absolute;top:90px;left:-9px;width:17px;height:17px;border-radius:50%;
    background:currentColor;border:4px solid var(--paper);
  }
  .pin .stem{position:absolute;left:-2px;width:4px;border-radius:3px;background:currentColor}
  .pin .lbl{position:absolute;left:-90px;width:180px;text-align:center}
  .pin .lbl b{display:block;font-family:"Archivo",sans-serif;font-size:44px;font-weight:800;
              line-height:1.05;letter-spacing:-.03em}
  .pin .lbl span{display:block;font-size:19px;font-weight:500;color:var(--ink-3);margin-top:2px}
  .up{color:var(--warn)}
  .up .lbl{top:0}
  .up .stem{top:76px;height:16px}
  .down{color:var(--ink-3)}
  .down .stem{top:105px;height:20px}
  .down .lbl{top:128px}
  .down .lbl b{color:var(--ink-2);font-size:38px}

  .bot{
    display:flex;align-items:flex-end;margin-top:36px;
    border-top:2px solid var(--ink);padding-top:20px;
  }
  .bot p{font-size:21px;font-weight:500;color:var(--ink-2);line-height:1.5}
  .bot .site{
    margin-left:auto;font-family:"Archivo",sans-serif;font-size:20px;font-weight:600;
    color:var(--ink-3);letter-spacing:.01em;
  }
</style>
</head>
<body>
  <div class="grid"></div>

  <div class="top">
    <svg width="52" height="22" viewBox="0 0 34 16" fill="none" aria-hidden="true">
      <path d="M1 8h6.5l2.6-6 3.6 12 3-9 2.4 5.4 1.9-2.4H33" stroke="currentColor" stroke-width="2.4"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="eyebrow">혈행 건강 자가진단</span>
    <span class="meta">10문항 · 약 1분 · 가입 없이 무료</span>
  </div>

  <h1>내 혈관은 실제 나이보다<br><em>몇 살</em>일까</h1>

  <div class="ruler">
    <div class="track"></div>
    <div class="tick" style="left:8%"></div>
    <div class="tick" style="left:24%"></div>
    <div class="tick" style="left:40%"></div>
    <div class="tick" style="left:56%"></div>
    <div class="tick" style="left:72%"></div>
    <div class="tick" style="left:88%"></div>
    <div class="span" style="left:30%;width:38%"></div>

    <div class="pin down" style="left:30%">
      <span class="dot"></span><span class="stem"></span>
      <span class="lbl"><b class="num">52</b><span>실제 나이</span></span>
    </div>
    <div class="pin up" style="left:68%">
      <span class="lbl"><b class="num">61</b><span>혈관 나이</span></span>
      <span class="stem"></span><span class="dot"></span>
    </div>
  </div>

  <div class="bot">
    <p>식습관 · 순환 징후 · 운동 · 검진 수치까지<br>10가지를 확인해 실제 나이와의 격차를 봅니다.</p>
    <span class="site">zinzinoshop.co.kr</span>
  </div>
</body>
</html>
